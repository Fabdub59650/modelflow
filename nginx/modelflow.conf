# ModelFlow — bloc Nginx inclus dans la configuration de FilaFlow
# Installé dans /etc/nginx/snippets/modelflow.conf par scripts/install.sh
# et appelé par « include snippets/modelflow.conf; » dans le server HTTPS.

location = /modelflow { return 301 /modelflow/; }

location /modelflow/ {
    # Le « / » final retire le préfixe : ModelFlow reçoit /api/..., /css/...
    proxy_pass         http://127.0.0.1:3002/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}
